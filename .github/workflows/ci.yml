name: CI

# Authoring-repo release evidence. PowerShell 7 is the primary host and native Windows PowerShell
# 5.1 is the supported fallback. Both execute the exact candidate composer, validators, context
# gate, meta suite, and all three generated-dist hook suites on Windows.

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert direct PowerShell 7 host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          $hostLeaf = [IO.Path]::GetFileName($hostPath)
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -lt 7 -or
              $hostLeaf -notmatch '^pwsh(?:\.exe)?$') {
            throw "Expected direct PowerShell 7 (pwsh); observed $hostLeaf $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }
      - name: Compose dists under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          foreach ($dist in 'dotnet', 'angular', 'monorepo') {
            & $hostPath -NoProfile -File scripts/build.ps1 $dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Dist freshness (rebuild == committed golden dist)
        run: |
          git add -A dist
          git diff --cached --exit-code --stat -- dist
      - name: Context footprint under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -File scripts/context-footprint.ps1 -Check
          exit $LASTEXITCODE
      - name: Validate dists under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          foreach ($dist in 'dotnet', 'angular', 'monorepo') {
            & $hostPath -NoProfile -File scripts/validate-dist.ps1 $dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Meta-hook test suite under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -File .claude/hooks/tests/Invoke-HookTests.ps1 -CaseCountPath "${{ runner.temp }}/windows-case-counts.txt"
          exit $LASTEXITCODE
      - name: Publish PS7 semantic case cardinality
        uses: actions/upload-artifact@v4
        with:
          name: b219-case-counts-windows
          path: ${{ runner.temp }}/windows-case-counts.txt
          if-no-files-found: error
          retention-days: 1

  windows-hooks:
    name: windows-hooks (${{ matrix.dist }})
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        dist: [dotnet, angular, monorepo]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert direct PowerShell 7 host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          $hostLeaf = [IO.Path]::GetFileName($hostPath)
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -lt 7 -or
              $hostLeaf -notmatch '^pwsh(?:\.exe)?$') {
            throw "Expected direct PowerShell 7 (pwsh); observed $hostLeaf $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }
      - name: Hook test suite (${{ matrix.dist }}) under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -File dist/${{ matrix.dist }}/tests/hooks/Invoke-HookTests.ps1 -CaseCountPath "${{ runner.temp }}/windows-hooks-${{ matrix.dist }}-case-counts.txt"
          exit $LASTEXITCODE
      - name: Publish PS7 semantic case cardinality (${{ matrix.dist }})
        uses: actions/upload-artifact@v4
        with:
          name: b219-case-counts-windows-hooks-${{ matrix.dist }}
          path: ${{ runner.temp }}/windows-hooks-${{ matrix.dist }}-case-counts.txt
          if-no-files-found: error
          retention-days: 1

  windows-ps51:
    name: windows-ps51
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert direct Windows PowerShell 5.1 host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          $hostLeaf = [IO.Path]::GetFileName($hostPath)
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or
              $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -ne 1 -or
              $hostLeaf -notmatch '^powershell(?:\.exe)?$') {
            throw "Expected direct Windows PowerShell 5.1; observed $hostLeaf $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }
      - name: Compose dists under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          foreach ($dist in 'dotnet', 'angular', 'monorepo') {
            & $hostPath -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 $dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Dist freshness (rebuild == committed golden dist)
        run: |
          git add -A dist
          git diff --cached --exit-code --stat -- dist
      - name: Context footprint under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -ExecutionPolicy Bypass -File scripts/context-footprint.ps1 -Check
          exit $LASTEXITCODE
      - name: Validate dists under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          foreach ($dist in 'dotnet', 'angular', 'monorepo') {
            & $hostPath -NoProfile -ExecutionPolicy Bypass -File scripts/validate-dist.ps1 $dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Meta-hook test suite under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -ExecutionPolicy Bypass -File .claude/hooks/tests/Invoke-HookTests.ps1 -CaseCountPath "${{ runner.temp }}/windows-ps51-case-counts.txt"
          exit $LASTEXITCODE
      - name: Download PS7 semantic case cardinality
        uses: actions/download-artifact@v4
        with:
          name: b219-case-counts-windows
          path: ${{ runner.temp }}/expected-windows-case-counts
      - name: Require equal nonzero PS7 and PS5.1 semantic case cardinality
        run: |
          $expectedPath = "${{ runner.temp }}/expected-windows-case-counts/windows-case-counts.txt"
          $actualPath = "${{ runner.temp }}/windows-ps51-case-counts.txt"
          $expected = [IO.File]::ReadAllBytes($expectedPath)
          $actual = [IO.File]::ReadAllBytes($actualPath)
          if ($expected.Length -eq 0 -or $actual.Length -eq 0 -or
              [Convert]::ToBase64String($expected) -cne [Convert]::ToBase64String($actual)) {
            throw "PS7 and PS5.1 meta semantic case cardinality differ.`nPS7:`n$([IO.File]::ReadAllText($expectedPath))`nPS5.1:`n$([IO.File]::ReadAllText($actualPath))"
          }

  windows-hooks-ps51:
    name: windows-hooks-ps51 (${{ matrix.dist }})
    needs: windows-hooks
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    strategy:
      fail-fast: false
      matrix:
        dist: [dotnet, angular, monorepo]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert direct Windows PowerShell 5.1 host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          $hostLeaf = [IO.Path]::GetFileName($hostPath)
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or
              $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -ne 1 -or
              $hostLeaf -notmatch '^powershell(?:\.exe)?$') {
            throw "Expected direct Windows PowerShell 5.1; observed $hostLeaf $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }
      - name: Hook test suite (${{ matrix.dist }}) under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -ExecutionPolicy Bypass -File dist/${{ matrix.dist }}/tests/hooks/Invoke-HookTests.ps1 -CaseCountPath "${{ runner.temp }}/windows-hooks-ps51-${{ matrix.dist }}-case-counts.txt"
          exit $LASTEXITCODE
      - name: Download PS7 semantic case cardinality (${{ matrix.dist }})
        uses: actions/download-artifact@v4
        with:
          name: b219-case-counts-windows-hooks-${{ matrix.dist }}
          path: ${{ runner.temp }}/expected-windows-hooks-${{ matrix.dist }}-case-counts
      - name: Require equal nonzero PS7 and PS5.1 semantic case cardinality (${{ matrix.dist }})
        run: |
          $expectedPath = "${{ runner.temp }}/expected-windows-hooks-${{ matrix.dist }}-case-counts/windows-hooks-${{ matrix.dist }}-case-counts.txt"
          $actualPath = "${{ runner.temp }}/windows-hooks-ps51-${{ matrix.dist }}-case-counts.txt"
          $expected = [IO.File]::ReadAllBytes($expectedPath)
          $actual = [IO.File]::ReadAllBytes($actualPath)
          if ($expected.Length -eq 0 -or $actual.Length -eq 0 -or
              [Convert]::ToBase64String($expected) -cne [Convert]::ToBase64String($actual)) {
            throw "PS7 and PS5.1 ${{ matrix.dist }} semantic case cardinality differ.`nPS7:`n$([IO.File]::ReadAllText($expectedPath))`nPS5.1:`n$([IO.File]::ReadAllText($actualPath))"
          }
