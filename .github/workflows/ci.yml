name: CI

# Authoring-repo release evidence, under PowerShell 7 on Windows: the exact candidate composer, validators,
# context gate, meta suite, and all three generated-dist hook suites.

on:
  pull_request:
  push:
    branches:
      - master
    # A push touching only top-level meta/*.md records or .claude/plans/** runs nothing. Order
    # matters (last match wins); the re-included file is read by release.ps1's CI watch.
    # push-and-check.ps1's Test-LightChangePath mirrors this list (PushAndCheck.Tests.ps1 case d).
    paths:
      - '**'
      - '!meta/*.md'
      - '!.claude/plans/**'
      - 'meta/review-ledger.md'

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert direct PowerShell 7 host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          $hostLeaf = [IO.Path]::GetFileName($hostPath)
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -lt 7 -or
              $hostLeaf -notmatch '^pwsh(?:\.exe)?$') {
            throw "Expected direct PowerShell 7 (pwsh); observed $hostLeaf $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }
      - name: Compose dists under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          # From HEAD^, not HEAD: on a commit that carries a release tag, HEAD would name its own tag and the baseline would equal the tree.
          # A root commit has no HEAD^ (not reachable here: full-depth checkout), and describe then fails and stops the job.
          $previousRelease = (git describe --tags --abbrev=0 --match 'v[0-9]*' 'HEAD^')
          if ($LASTEXITCODE -ne 0 -or -not $previousRelease) { throw 'no v[0-9]* release tag reachable from HEAD^; cannot examine the retirement baseline' }
          foreach ($dist in 'dotnet', 'angular', 'monorepo') {
            & $hostPath -NoProfile -File scripts/build.ps1 $dist -RetirementBaselineRef $previousRelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Dist freshness (rebuild == committed golden dist)
        run: |
          git add -A dist
          git diff --cached --exit-code --stat -- dist
      - name: Context footprint under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -File scripts/context-footprint.ps1 -Check
          exit $LASTEXITCODE
      - name: Validate dists under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          foreach ($dist in 'dotnet', 'angular', 'monorepo') {
            & $hostPath -NoProfile -File scripts/validate-dist.ps1 $dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # The meta suite in four bins of about equal measured cost (B-510): run in one job it took 18 to 35
  # minutes. windows-case-parity checks that the bins together ran every meta test file once.
  windows-meta:
    name: windows-meta (${{ matrix.shard }})
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert direct PowerShell 7 host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          $hostLeaf = [IO.Path]::GetFileName($hostPath)
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -lt 7 -or
              $hostLeaf -notmatch '^pwsh(?:\.exe)?$') {
            throw "Expected direct PowerShell 7 (pwsh); observed $hostLeaf $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }
      - name: Meta-hook test suite (shard ${{ matrix.shard }} of 4) under the asserted host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -File .claude/hooks/tests/Invoke-HookTests.ps1 -ShardCount 4 -ShardIndex ${{ matrix.shard }} -CaseCountPath "${{ runner.temp }}/windows-meta-${{ matrix.shard }}-case-counts.txt"
          exit $LASTEXITCODE
      - name: Publish PS7 semantic case cardinality (meta shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        with:
          name: b219-case-counts-windows-meta-${{ matrix.shard }}
          path: ${{ runner.temp }}/windows-meta-${{ matrix.shard }}-case-counts.txt
          if-no-files-found: error
          retention-days: 1

  # Each dist's shipped hook suite in two bins of about equal measured cost (B-510): run whole, monorepo's
  # took 12 to 13 minutes, nearly all of it Guard.Tests.ps1, now split in two. windows-case-parity checks that
  # each dist's bins together ran each of its hook test files once. HOOKTESTS_TIMING prints each file's
  # TIMING line, the costs the runner's bins are re-measured from.
  windows-hooks:
    name: windows-hooks (${{ matrix.dist }}, ${{ matrix.shard }})
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        dist: [dotnet, angular, monorepo]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Assert direct PowerShell 7 host
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          $hostLeaf = [IO.Path]::GetFileName($hostPath)
          if ($PSVersionTable.PSEdition -ne 'Core' -or
              $PSVersionTable.PSVersion.Major -lt 7 -or
              $hostLeaf -notmatch '^pwsh(?:\.exe)?$') {
            throw "Expected direct PowerShell 7 (pwsh); observed $hostLeaf $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }
      - name: Hook test suite (${{ matrix.dist }}, shard ${{ matrix.shard }} of 2) under the asserted host
        env:
          HOOKTESTS_TIMING: '1'
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -File dist/${{ matrix.dist }}/tests/hooks/Invoke-HookTests.ps1 -ShardCount 2 -ShardIndex ${{ matrix.shard }} -CaseCountPath "${{ runner.temp }}/windows-hooks-${{ matrix.dist }}-${{ matrix.shard }}-case-counts.txt"
          exit $LASTEXITCODE
      - name: Publish PS7 semantic case cardinality (${{ matrix.dist }}, shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        with:
          name: b219-case-counts-windows-hooks-${{ matrix.dist }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/windows-hooks-${{ matrix.dist }}-${{ matrix.shard }}-case-counts.txt
          if-no-files-found: error
          retention-days: 1

  windows-case-parity:
    name: windows-case-parity
    needs: [windows, windows-meta, windows-hooks]
    if: ${{ always() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Download all semantic case cardinality artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: b219-case-counts-*
          path: ${{ runner.temp }}/case-count-artifacts
          merge-multiple: false
      - name: Require valid nonzero PS7 semantic case cardinality
        run: |
          $hostPath = (Get-Process -Id $PID).Path
          & $hostPath -NoProfile -File .claude/scripts/assert-ci-case-parity.ps1 -ArtifactRoot "${{ runner.temp }}/case-count-artifacts"
          exit $LASTEXITCODE
