name: CI

# Repo-scale docs-sync-check for the authoring repo: proves src/ -> dist/ freshness on every
# push/PR (rebuild + diff must be empty), that every dist passes its own template-checks and
# parse gates (validate-dist), and that the hook test suites pass inside each dist.
#
# windows leg drives the .ps1 twins; linux leg drives the .sh twins — each leg rebuilds with
# its own twin and diffs against the committed golden dist, so composer twin divergence fails
# one of the two legs.
#
# The strict fidelity-check legs (dist == freeze-v0.25.5 baseline) were retired at the v0.26.0
# release — the merge's zero-behaviour-change was proven and permanently recorded (WSD-012/018),
# and v0.26.0 deliberately changes shipped content (actions/checkout v4->v5), so the freeze tags
# are no longer the baseline. The freshness gate (rebuild + git diff) now fully guards src->dist.
# scripts/fidelity-check.{ps1,sh} remain for manual re-audit against the pre-restructure tag.

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # fetch-tags is REQUIRED, not a nicety. The default checkout is `--depth=1 --no-tags`, and
      # ReleaseStagingGuard.Tests replays the last 8 release tags to prove the release staging
      # allowlist has not silently narrowed. With no tags it cannot run, and it refuses to report a
      # vacuous pass -- so the meta suite fails. Removing this line does not weaken that test
      # quietly; it turns CI red, which is the intended direction for a check that cannot run.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compose dists (build.ps1 twin)
        run: |
          pwsh -NoProfile -File scripts/build.ps1 dotnet
          pwsh -NoProfile -File scripts/build.ps1 angular
          pwsh -NoProfile -File scripts/build.ps1 monorepo
      - name: Dist freshness (rebuild == committed golden dist)
        run: |
          git add -A dist
          git diff --cached --exit-code --stat -- dist
      - name: Context footprint (context-footprint.ps1 twin)
        run: pwsh -NoProfile -File scripts/context-footprint.ps1 -Check
      - name: Validate dists (parse gates + per-dist template-checks)
        run: |
          pwsh -NoProfile -File scripts/validate-dist.ps1 dotnet
          pwsh -NoProfile -File scripts/validate-dist.ps1 angular
          pwsh -NoProfile -File scripts/validate-dist.ps1 monorepo
      - name: Meta-hook test suite (bom-fix + repo-wide BOM gate)
        run: pwsh -NoProfile -File .claude/hooks/tests/Invoke-HookTests.ps1

  # The three shipped hook suites used to run serially inside the `windows` job and were its
  # dominant cost. They are split onto their own runners here (B-113): the suites execute against
  # the COMMITTED dist/, whose equivalence to src/ the freshness gate in `windows` already proves,
  # so they need a checkout and nothing else -- no compose, no ordering dependency. Splitting buys
  # real concurrency rather than more lanes on one box: B-101 measured that added lanes plateau
  # because process creation serialises, so three suites sharing one runner would not have helped.
  # fail-fast is off so one dist's failure still reports the other two.
  windows-hooks:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dist: [dotnet, angular, monorepo]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Hook test suite (${{ matrix.dist }}, .ps1 twins)
        run: pwsh -NoProfile -File dist/${{ matrix.dist }}/tests/hooks/Invoke-HookTests.ps1

  linux:
    runs-on: ubuntu-latest
    steps:
      # fetch-tags is REQUIRED, not a nicety. The default checkout is `--depth=1 --no-tags`, and
      # ReleaseStagingGuard.Tests replays the last 8 release tags to prove the release staging
      # allowlist has not silently narrowed. With no tags it cannot run, and it refuses to report a
      # vacuous pass -- so the meta suite fails. Removing this line does not weaken that test
      # quietly; it turns CI red, which is the intended direction for a check that cannot run.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compose dists (build.sh twin)
        run: |
          bash scripts/build.sh dotnet
          bash scripts/build.sh angular
          bash scripts/build.sh monorepo
      - name: Dist freshness (rebuild == committed golden dist)
        run: |
          git add -A dist
          git diff --cached --exit-code --stat -- dist
      - name: Context footprint (context-footprint.sh twin)
        run: bash scripts/context-footprint.sh -Check
      - name: Validate dists (parse gates + per-dist template-checks)
        run: |
          bash scripts/validate-dist.sh dotnet
          bash scripts/validate-dist.sh angular
          bash scripts/validate-dist.sh monorepo
      - name: Meta-hook test suite (bom-fix + repo-wide BOM gate)
        run: pwsh -NoProfile -File .claude/hooks/tests/Invoke-HookTests.ps1

  # Linux half of the same split. Named separately from windows-hooks so both remain individually
  # assertable by watch-ci.ps1 -- a leg that silently stops running must fail, not pass quietly.
  linux-hooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dist: [dotnet, angular, monorepo]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Hook test suite (${{ matrix.dist }}, exercises the .sh twins via bash)
        run: pwsh -NoProfile -File dist/${{ matrix.dist }}/tests/hooks/Invoke-HookTests.ps1

  # Provider-specific compatibility proof (WSD-061), not a third generic test leg. Windows and
  # Linux cannot execute stock macOS /bin/bash 3.2; composition already proves this one authored
  # installer reaches every dist, so one direct committed-dotnet smoke is the complete recurring
  # scope. The frozen-parent step is transitional B-198 evidence and is removed after its first
  # observed red/current-green run; the current shipped smoke remains.
  macos-portability:
    runs-on: macos-26
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Assert the stock Bash 3.2 provider
        run: |
          [ "$BASH" = /bin/bash ] || { echo "expected /bin/bash, found '$BASH'" >&2; exit 1; }
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "expected stock Bash 3.2.57, found '$BASH_VERSION'" >&2; exit 1 ;;
          esac
          /bin/bash --version
      - name: Frozen installer is red before mutation (transitional B-198 evidence)
        env:
          B198_FROZEN_TREE: 82383666425b0916c23fe2475ee71ef48a9327db
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          fail() { echo "B-198 frozen-tree oracle: $*" >&2; exit 1; }
          frozen="$RUNNER_TEMP/b198-frozen"
          target="$RUNNER_TEMP/b198-frozen-target"
          oracle="$RUNNER_TEMP/b198-frozen-Smoke.csproj"
          mkdir -p "$frozen" "$target"
          git archive "$B198_FROZEN_TREE" dist/dotnet | tar -x -C "$frozen"
          printf '<Project Sdk="Microsoft.NET.Sdk">\n</Project>\n' > "$oracle"
          cp "$oracle" "$target/Smoke.csproj"
          set +e
          output=$(/bin/bash "$frozen/dist/dotnet/scripts/install.sh" "$target" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          [ "$status" -ne 0 ] || fail 'the Bash-4 installer unexpectedly exited zero'
          printf '%s\n' "$output" | grep -E 'declare: -A: invalid option|bad substitution' >/dev/null || fail 'the expected Bash-4 diagnostic was absent'
          [ "$(find "$target" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" -eq 1 ] || fail 'the frozen installer mutated the target tree'
          cmp -s "$oracle" "$target/Smoke.csproj" || fail 'the frozen installer changed the consumer sentinel'
      - name: Current shipped installer is green under stock Bash 3.2
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          fail() { echo "B-198 current-tree oracle: $*" >&2; exit 1; }
          target="$RUNNER_TEMP/b198-current-target"
          oracle="$RUNNER_TEMP/b198-current-Smoke.csproj"
          mkdir -p "$target"
          printf '<Project Sdk="Microsoft.NET.Sdk">\n</Project>\n' > "$oracle"
          cp "$oracle" "$target/Smoke.csproj"
          set +e
          output=$(/bin/bash dist/dotnet/scripts/install.sh "$target" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          [ "$status" -eq 0 ] || fail "installer exited $status"
          printf '%s\n' "$output" | grep -F 'mode: greenfield' >/dev/null || fail 'greenfield mode was not observed'
          printf '%s\n' "$output" | grep -F 'Done. Next steps in the target repo:' >/dev/null || fail 'greenfield completion was not observed'
          cmp -s "$oracle" "$target/Smoke.csproj" || fail 'the installer changed the consumer sentinel'
          cmp -s dist/dotnet/.claude/framework-version.json "$target/.claude/framework-version.json" || fail 'the installed version stamp differs from the committed dist'
          cmp -s dist/dotnet/framework-ownership.json "$target/framework-ownership.json" || fail 'the installed ownership manifest differs from the committed dist'
