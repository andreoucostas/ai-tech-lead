# Bamboo Specs starting point for the AI Tech Lead framework-state gate.
# Define the custom `windows-powershell` capability only on self-hosted Windows agents that have
# PowerShell 7. Replace the project and plan keys, connect the Bitbucket Data Center repository, and
# require the resulting Bamboo build in Bitbucket. This file alone is not a merge gate.
version: 2

plan:
  project-key: REPLACE_ME
  key: AITECHLEAD
  name: AI Tech Lead framework state

stages:
  - Framework checks:
      manual: false
      final: false
      jobs:
        - Docs sync check

Docs sync check:
  key: DOCSYNC
  requirements:
    - windows-powershell
  tasks:
    - checkout:
        force-clean-build: true
    - script:
        interpreter: WINDOWS_POWER_SHELL
        scripts:
          - pwsh -NoProfile -File scripts/docs-sync-check.ps1

branches:
  create: for-new-branch
  delete:
    after-deleted-days: 7
    after-inactive-days: 30
